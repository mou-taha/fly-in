[project]
name = "fly-in"
version = "0.1.0"
description = "An efficient drone routing system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "simple-term-menu>=1.6.4",
    "colorama>=0.4.6",
]
[tool.black]
line-length = 79

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]